name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website (http/https)'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      icon_url:
        description: 'URL icon (PNG/JPG)'
        required: true
        type: string
      tag:
        description: 'Build tag'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Ganti setup-android@v3 dengan ini — pakai SDK pre-installed
      - name: Setup Android SDK (manual, tanpa error)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "✅ Android SDK: $ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT || true

      # Optional: install platform yang dibutuhkan (tanpa 'tools')
      - name: Install Android platform 34 + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Validate URL & normalize
        id: url
        run: |
          RAW_URL="${{ inputs.web_url }}"
          if [[ ! "$RAW_URL" =~ ^https?:// ]]; then
            RAW_URL="https://$RAW_URL"
          fi
          if ! echo "$RAW_URL" | grep -qE '^https?://[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}'; then
            echo "❌ URL tidak valid: $RAW_URL"
            exit 1
          fi
          echo "url=$RAW_URL" >> $GITHUB_OUTPUT
          echo "✅ URL valid: $RAW_URL"

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cat > package.json <<'EOF'
          {
            "name": "web2app",
            "version": "1.0.0",
            "private": true
          }
          EOF
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Generate Capacitor config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.web2app.${{ github.run_id }}",
            "appName": "${{ inputs.app_name }}",
            "webDir": "www",
            "server": {
              "url": "${{ steps.url.outputs.url }}",
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          cat capacitor.config.json

      - name: Generate index.html
        run: |
          cat > www/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${{ inputs.app_name }}</title>
            <meta http-equiv="refresh" content="0; url=${{ steps.url.outputs.url }}">
          </head>
          <body>
            <script>window.location.href = "${{ steps.url.outputs.url }}";</script>
          </body>
          </html>
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Download & apply icon
        run: |
          ICON_URL="${{ inputs.icon_url }}"
          mkdir -p /tmp/icon
          curl -fsSL "$ICON_URL" -o /tmp/icon/icon.png || {
            echo "⚠️ Gagal download icon, pakai default"
            exit 0
          }
          file /tmp/icon/icon.png || true

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DIR="android/app/src/main/res/mipmap-$density"
            mkdir -p "$DIR"
            convert /tmp/icon/icon.png -resize 512x512 "$DIR/ic_launcher.png" 2>/dev/null || \
            cp /tmp/icon/icon.png "$DIR/ic_launcher.png"
            cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png" 2>/dev/null || true
          done

      - name: Patch AndroidManifest (cleartext + INTERNET)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          SAFE_NAME=$(echo "${{ inputs.app_name }}" | tr ' ' '_' | tr -cd '[:alnum:]_-')
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "output/${SAFE_NAME}-${{ inputs.tag }}.apk"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 7

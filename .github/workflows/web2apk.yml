name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website (http/https)'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      icon_url:
        description: 'URL icon (PNG/JPG)'
        required: true
        type: string
      tag:
        description: 'Build tag'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK + ImageMagick
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sudo apt-get install -y imagemagick > /dev/null 2>&1 || true

      - name: Validate URL
        id: url
        run: |
          RAW_URL="${{ inputs.web_url }}"
          if [[ ! "$RAW_URL" =~ ^https?:// ]]; then
            RAW_URL="https://$RAW_URL"
          fi
          if ! echo "$RAW_URL" | grep -qE '^https?://[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}'; then
            echo "❌ URL tidak valid: $RAW_URL"
            exit 1
          fi
          echo "url=$RAW_URL" >> $GITHUB_OUTPUT
          echo "✅ URL valid: $RAW_URL"

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cat > package.json <<'EOF'
          {
            "name": "web2app",
            "version": "1.0.0",
            "private": true
          }
          EOF
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Generate Capacitor config
        run: |
          HASH=$(echo "${{ github.run_id }}-${{ inputs.tag }}" | md5sum | cut -c1-8)
          APP_ID="com.web2app.a${HASH}"
          echo "📱 App ID: $APP_ID"
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${{ inputs.app_name }}",
            "webDir": "www",
            "server": {
              "url": "${{ steps.url.outputs.url }}",
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          cat capacitor.config.json

      - name: Generate index.html
        run: |
          cat > www/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${{ inputs.app_name }}</title>
            <meta http-equiv="refresh" content="0; url=${{ steps.url.outputs.url }}">
          </head>
          <body>
            <script>window.location.href = "${{ steps.url.outputs.url }}";</script>
          </body>
          </html>
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Download & apply icon (full replace)
        run: |
          ICON_URL="${{ inputs.icon_url }}"
          mkdir -p /tmp/icon

          if ! curl -fsSL "$ICON_URL" -o /tmp/icon/original; then
            echo "⚠️ Gagal download icon, skip"
            exit 0
          fi
          file /tmp/icon/original

          convert /tmp/icon/original -resize 512x512! /tmp/icon/icon.png 2>/dev/null || \
            cp /tmp/icon/original /tmp/icon/icon.png

          convert /tmp/icon/icon.png -resize 340x340 -background none \
            -gravity center -extent 512x512 /tmp/icon/foreground.png 2>/dev/null || \
            cp /tmp/icon/icon.png /tmp/icon/foreground.png

          convert -size 512x512 xc:white /tmp/icon/background.png 2>/dev/null || \
            cp /tmp/icon/icon.png /tmp/icon/background.png

          RES="android/app/src/main/res"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DIR="$RES/mipmap-$density"
            mkdir -p "$DIR"
            cp /tmp/icon/icon.png "$DIR/ic_launcher.png"
            cp /tmp/icon/icon.png "$DIR/ic_launcher_round.png"
            cp /tmp/icon/foreground.png "$DIR/ic_launcher_foreground.png"
            cp /tmp/icon/background.png "$DIR/ic_launcher_background.png"
          done

          mkdir -p "$RES/drawable"
          cp /tmp/icon/icon.png "$RES/drawable/ic_launcher.png" 2>/dev/null || true
          cp /tmp/icon/foreground.png "$RES/drawable/ic_launcher_foreground.png" 2>/dev/null || true

          rm -rf "$RES/mipmap-anydpi-v26"
          echo "🗑️ Adaptive XML dihapus"

          echo "📦 Icon terpasang:"
          find "$RES" -name "ic_launcher*" -exec ls -lh {} \; | head -30

      - name: Patch AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          SAFE_NAME=$(echo "${{ inputs.app_name }}" | tr ' ' '_' | tr -cd '[:alnum:]_-')
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "output/${SAFE_NAME}-${{ inputs.tag }}.apk"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 7
